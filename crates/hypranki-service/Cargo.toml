[package]
name = "hypranki-service"
version = "0.1.0"
edition = "2024"

[dependencies]
utoipa = "6"
fsrs = "7"
sqlx = "0.9"
serde = { version = "1", features = ["derive"] }
hypranki-storage.workspace = true
anyhow = "1"
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
